<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="450" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0314" />
      <stop offset="50%" stop-color="#180a2b" />
      <stop offset="100%" stop-color="#0b0314" />
    </linearGradient>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Trophy Cell Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Holographic Shine Sweep -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCard {
      0% { filter: drop-shadow(0 0 4px rgba(236, 72, 153, 0.3)); }
      50% { filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.6)); }
      100% { filter: drop-shadow(0 0 4px rgba(236, 72, 153, 0.3)); }
    }
    .card-bg {
      animation: pulseCard 6s infinite ease-in-out;
    }

    /* Shine Sweep Animation */
    @keyframes shineSweep {
      0% { transform: translateX(-200px) translateY(-100px) rotate(25deg); }
      100% { transform: translateX(450px) translateY(100px) rotate(25deg); }
    }
    .shine-sweep {
      animation: shineSweep 4s infinite linear;
    }

    /* Pop-In Trophy Animation */
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .trophy-cell {
      opacity: 0;
      transform-origin: 50% 50%;
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .cell-1 { animation-delay: 0.2s; transform-origin: 85px 115px; }
    .cell-2 { animation-delay: 0.5s; transform-origin: 225px 115px; }
    .cell-3 { animation-delay: 0.8s; transform-origin: 365px 115px; }

    /* Float Animation for Trophies */
    @keyframes floatY {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .float-icon {
      animation: floatY 3s infinite ease-in-out;
    }
    .float-icon-1 { animation-delay: 0s; }
    .float-icon-2 { animation-delay: 0.5s; }
    .float-icon-3 { animation-delay: 1s; }

    /* Typography */
    .title-text {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-weight: 700;
      fill: #f472b6;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .trophy-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #e2e8f0;
      text-anchor: middle;
    }
    .trophy-sub {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #94a3b8;
      text-anchor: middle;
    }
    .rank-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 14px;
      fill: #ffffff;
      text-anchor: middle;
    }
  </style>

  <!-- Background Card -->
  <rect class="card-bg" x="3" y="3" width="444" height="194" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Shine Sweep Sheet -->
  <g clip-path="url(#cardClip)">
    <rect class="shine-sweep" x="-100" y="-100" width="120" height="400" fill="url(#shineGrad)" pointer-events="none" />
  </g>

  <!-- Clip Path for the card rounded corners -->
  <clipPath id="cardClip">
    <rect x="3" y="3" width="444" height="194" rx="16" />
  </clipPath>

  <!-- Title -->
  <text class="title-text" x="25" y="35">GitHub Profile Trophies</text>

  <!-- Trophy Grid -->
  <!-- Trophy 1: Deep Learning Master -->
  <g class="trophy-cell cell-1" transform="translate(0, 0)">
    <!-- Cell Plate -->
    <rect x="25" y="55" width="120" height="120" rx="12" fill="#150a26" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3" />
    <!-- Floating Trophy Icon -->
    <g class="float-icon float-icon-1" transform="translate(85, 100)">
      <!-- Cup Body -->
      <path d="M-15,-20 L15,-20 L12,-2 L-12,-2 Z" fill="url(#goldGrad)" filter="url(#glow)" />
      <path d="M-12,-2 L12,-2 L0,12 Z" fill="url(#goldGrad)" />
      <!-- Base -->
      <rect x="-8" y="12" width="16" height="4" fill="#d97706" rx="1" />
      <rect x="-12" y="16" width="24" height="5" fill="#1e293b" rx="2" />
      <!-- Handles -->
      <path d="M-15,-15 C-22,-15 -22,-5 -12,-5" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
      <path d="M15,-15 C22,-15 22,-5 12,-5" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
      <!-- Star Accent -->
      <path d="M0,-14 L2,-10 L7,-10 L3,-7 L5,-2 L0,-5 L-5,-2 L-3,-7 L-7,-10 L-2,-10 Z" fill="#ffffff" />
    </g>
    <!-- Rank Badge -->
    <rect x="73" y="126" width="24" height="16" rx="4" fill="#fbbf24" />
    <text class="rank-badge" x="85" y="139">S</text>
    <!-- Titles -->
    <text class="trophy-title" x="85" y="157">Deep Learning</text>
    <text class="trophy-sub" x="85" y="169">Expert Rank</text>
  </g>

  <!-- Trophy 2: Generative AI Guru -->
  <g class="trophy-cell cell-2" transform="translate(0, 0)">
    <!-- Cell Plate -->
    <rect x="165" y="55" width="120" height="120" rx="12" fill="#150a26" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" />
    <!-- Floating Trophy Icon -->
    <g class="float-icon float-icon-2" transform="translate(225, 100)">
      <!-- Crown / Sparkle Design -->
      <circle cx="0" cy="-6" r="16" fill="url(#purpleGrad)" filter="url(#glow)" />
      <path d="M-8,-2 L-12,-16 L-4,-10 L0,-18 L4,-10 L12,-16 L8,-2 Z" fill="#ffffff" />
      <!-- Base -->
      <rect x="-10" y="12" width="20" height="4" fill="#a78bfa" rx="1" />
      <rect x="-14" y="16" width="28" height="5" fill="#1e293b" rx="2" />
    </g>
    <!-- Rank Badge -->
    <rect x="210" y="126" width="30" height="16" rx="4" fill="#8b5cf6" />
    <text class="rank-badge" x="225" y="139">A+</text>
    <!-- Titles -->
    <text class="trophy-title" x="225" y="157">Generative AI</text>
    <text class="trophy-sub" x="225" y="169">Creator Rank</text>
  </g>

  <!-- Trophy 3: Python Wizard -->
  <g class="trophy-cell cell-3" transform="translate(0, 0)">
    <!-- Cell Plate -->
    <rect x="305" y="55" width="120" height="120" rx="12" fill="#150a26" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" />
    <!-- Floating Trophy Icon -->
    <g class="float-icon float-icon-3" transform="translate(365, 100)">
      <!-- Magic Wand / Star Cup -->
      <path d="M-15,-20 L15,-20 L12,-2 L-12,-2 Z" fill="url(#pinkGrad)" filter="url(#glow)" />
      <path d="M-12,-2 L12,-2 L0,12 Z" fill="url(#pinkGrad)" />
      <!-- Base -->
      <rect x="-8" y="12" width="16" height="4" fill="#db2777" rx="1" />
      <rect x="-12" y="16" width="24" height="5" fill="#1e293b" rx="2" />
      <!-- Star atop -->
      <g transform="translate(0, -25)">
        <path d="M0,-8 L2,-3 L7,-3 L3,-1 L5,4 L0,1 L-5,4 L-3,-1 L-7,-3 L-2,-3 Z" fill="#ffffff" />
      </g>
    </g>
    <!-- Rank Badge -->
    <rect x="350" y="126" width="30" height="16" rx="4" fill="#ec4899" />
    <text class="rank-badge" x="365" y="139">S+</text>
    <!-- Titles -->
    <text class="trophy-title" x="365" y="157">Python Wizard</text>
    <text class="trophy-sub" x="365" y="169">Elite Coder</text>
  </g>
</svg>
